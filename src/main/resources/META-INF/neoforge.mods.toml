modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/jens-hj/dynamic-trees-compat-registry-fix/issues"

[[mods]]
modId = "dtc_registry_fix"
version = "${version}"
displayName = "Dynamic Trees Compat Registry Fix"
authors = "jens-hj"
logoFile = "icon.png"
description = '''Makes Dynamic Trees Compat 2.3 register the same wood types on fresh and cached startup, preventing related multiplayer registry mismatches.'''

[[mixins]]
config = "dtc_registry_fix.mixins.json"

[[dependencies.dtc_registry_fix]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
side = "BOTH"

[[dependencies.dtc_registry_fix]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.266,)"
side = "BOTH"

[[dependencies.dtc_registry_fix]]
modId = "dynamictreescompat"
type = "required"
versionRange = "[2.3]"
ordering = "AFTER"
side = "BOTH"
